server {
    listen 8080 default_server;        # 改：监听 8080
    root /var/www/lab/dist;            # 改：静态文件的根目录
    index index.html;

    location / {                       # 新增：处理所有请求
        try_files $uri $uri/ =404;
    }
}

# 写回配置后，在右侧终端里依次执行：
#   sudo nginx -t                       检查配置语法
#   sudo nginx                          没有报错就启动
#   curl -i localhost:8080/             应该是 200，响应体是「WineryLab 首页」
#   curl -i localhost:8080/posts/42     没有对应的文件，404
