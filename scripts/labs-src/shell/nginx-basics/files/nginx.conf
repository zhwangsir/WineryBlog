# 站点配置文件：/etc/nginx/sites-available/default
# 一个 server 块就是一台「虚拟主机」：谁监听、文件从哪找、请求怎么处理，都写在这里
# 改完点右上角的「运行」把配置写回站点文件，再到右侧终端里用 nginx -t 检查

server {
    # 现在监听的是系统默认的 80 端口
    # TODO（Step 1）：改成监听 8080，避免和系统里的其它服务抢 80 端口
    listen 80 default_server;

    # TODO（Step 1）：把 root 改成静态站点所在的目录 /var/www/lab/dist
    root /usr/share/nginx/html;

    # 访问 / 时默认返回的文件
    index index.html;

    # TODO（Step 1）：加一个处理所有请求的 location / 块
    #   用 try_files $uri $uri/ =404; ——先按请求路径找文件，再当目录找，都没有就返回 404

    # TODO（Step 2）：把 try_files 最后的 =404 换成 /index.html，支持单页应用的路由

    # TODO（Step 3）：加一个 location /api/ 块，把接口请求转发（proxy_pass）给后端
}
