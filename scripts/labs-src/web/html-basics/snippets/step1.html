<!doctype html>                      <!-- 文档声明：告诉浏览器这是一份现代 HTML 文档 -->
<html lang="zh-CN">                  <!-- 页面语言：读屏软件据此选择发音 -->
<head>
  <meta charset="utf-8">             <!-- 字符编码：保证中文不乱码 -->
  <title>我的品饮笔记</title>          <!-- 浏览器标签页上显示的标题 -->
</head>
<body>
  <header>
    <h1>我的品饮笔记</h1>
    <p>记录每一杯值得记住的酒</p>     <!-- 副标题：用 <p>，放在 <h1> 下面 -->
  </header>

  <nav>
    <a href="#">首页</a>             <!-- href="#" 表示指向当前页，练习时就这样写 -->
    <a href="#">教程</a>
    <a href="#">关于</a>
  </nav>

  <!-- 后面的 <main>、<footer> 保持不变 -->
</body>
</html>
