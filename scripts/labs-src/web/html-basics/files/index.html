<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>TODO：给页面起个标题</title>
  <style>
    /* 这里的样式只是让页面好看一点，本示例不用改。CSS 会在后面的示例里专门讲 */
    body {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 24px;
      background: #12181f;
      color: #dfe6ee;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      line-height: 1.75;
    }
    h1 { margin: 0; font-size: 30px; color: #ffffff; }
    header p { margin: 2px 0 0; color: #8b98ab; font-size: 14px; }
    h2 { margin: 32px 0 8px; font-size: 20px; color: #f27d26; }
    p { margin: 8px 0; }
    a { color: #f27d26; text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a3550;
    }
    li { margin: 4px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    th, td { padding: 8px 12px; border: 1px solid #2a3550; text-align: left; }
    th { background: #1a2230; color: #3ecf8e; }
    footer {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid #2a3550;
      color: #8b98ab;
      font-size: 13px;
    }
    footer p { margin: 0; }
  </style>
</head>
<body>
  <header>
    <h1>我的品饮笔记</h1>
    <!-- TODO（第 1 步）：在 <h1> 下面补一行副标题，用 <p> 标签包起来，内容自拟，例如「记录每一杯值得记住的酒」 -->
  </header>

  <nav>
    <a href="#">首页</a>
    <!-- TODO（第 1 步）：照着上面「首页」的写法，再补两个链接，文字分别是「教程」和「关于」 -->
  </nav>

  <main>
    <article>
      <h2>看懂酒标</h2>
      <p>酒标上最有用的信息是产区、年份和葡萄品种。产区告诉你这瓶酒出生在哪里，年份告诉你那一年的天气如何，品种则决定了它大致的口感。</p>
      <!-- TODO（第 3 步）：把上面段落里的「产区、年份和葡萄品种」用 <strong> 标签包起来，让它变成粗体 -->

      <p>先认识三个最常见的红葡萄品种：</p>
      <ul>
        <li>赤霞珠：单宁重，有黑加仑和青椒的气息。</li>
        <li>黑皮诺：酒体轻，酸度明亮，常带樱桃香气。</li>
        <!-- TODO（第 2 步）：再补一个 <li>，内容是「梅洛：口感柔和，李子和巧克力的味道」 -->
      </ul>

      <p>正式开喝之前，按顺序做三件事：</p>
      <!-- TODO（第 2 步）：在这里写一个有序列表 <ol>，三项依次是「看颜色」「闻香气」「尝味道」 -->

      <h2>我的品饮记录</h2>
      <table>
        <thead>
          <tr>
            <th>酒名</th>
            <th>类型</th>
            <th>评分</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>赤霞珠干红</td>
            <td>红</td>
            <td>4.5</td>
          </tr>
          <!-- TODO（第 2 步）：照着上面的写法，在 <tbody> 里再补两行数据，内容自拟 -->
        </tbody>
      </table>
    </article>
  </main>

  <footer>
    <!-- TODO（第 3 步）：写一行版权信息，例如「© 2026 我的品饮笔记」，并在同一行加一个链接，文字是「联系我们」 -->
  </footer>
</body>
</html>
