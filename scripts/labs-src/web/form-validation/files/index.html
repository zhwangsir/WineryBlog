<main class="card">
  <h1>创建账号</h1>
  <p class="sub">格式问题交给浏览器，密码是否一致交给 JS。</p>

  <!-- 没有写 action：这个示例没有服务器，提交会被 script.js 拦住 -->
  <form id="reg-form">
    <div class="field">
      <label for="nickname">昵称</label>
      <input id="nickname" name="nickname" type="text" placeholder="至少 2 个字" autocomplete="off">
      <!-- TODO（第 1 步）：给上面的 <input> 加上 required 和 minlength="2" 两个属性 -->
    </div>

    <div class="field">
      <label for="phone">手机号</label>
      <input id="phone" name="phone" type="tel" placeholder="11 位手机号" maxlength="11" autocomplete="off">
      <!-- TODO（第 2 步）：给上面的 <input> 加上三个属性：
           required
           pattern="1[3-9]\d{9}"
           title="请输入 11 位大陆手机号" -->
    </div>

    <div class="field">
      <label for="pwd1">密码</label>
      <input id="pwd1" name="password" type="password" placeholder="至少 8 位">
      <!-- TODO（第 1 步）：给上面的 <input> 加上 required 和 minlength="8" 两个属性 -->
      <p class="msg" id="pwd1-msg"></p>
    </div>

    <div class="field">
      <label for="pwd2">确认密码</label>
      <input id="pwd2" name="password2" type="password" placeholder="再输入一次" required>
      <p class="msg" id="pwd2-msg"></p>
    </div>

    <button type="submit">注册</button>
  </form>

  <p id="result" class="result"></p>
</main>
