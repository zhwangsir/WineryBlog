<!-- pattern：用正则表达式描述格式，提交时浏览器会拿输入内容去匹配 -->
<!-- 1[3-9]\d{9}：以 1 开头，第二位是 3 到 9，后面再跟 9 位数字，一共 11 位 -->
<!-- maxlength="11"：从输入阶段就直接限制最多 11 个字符 -->
<!-- title：浏览器默认的格式提示很笼统，title 里的说明会一起显示在提示气泡里 -->
<div class="field">
  <label for="phone">手机号</label>
  <input id="phone" name="phone" type="tel" placeholder="11 位手机号" maxlength="11" autocomplete="off"
         required pattern="1[3-9]\d{9}" title="请输入 11 位大陆手机号">
</div>
