<header class="page-head">
  <h1>作品集网格</h1>
  <p>不用一张图片，只靠 CSS Grid 排出一个会随宽度变化的相册。</p>
</header>

<!-- 卡片上的三个标记和布局有关：featured（横跨 2 列、纵跨 2 行）、tall（纵跨 2 行）、wide（横跨 2 列） -->
<!-- c-xxx 只决定卡片的渐变配色，和布局无关 -->
<div class="gallery">
  <figure class="card featured c-sunrise">
    <figcaption>
      <span class="no">01</span>
      <h2>年度旗舰</h2>
      <p>赤霞珠 · 2019</p>
    </figcaption>
  </figure>

  <figure class="card tall c-dusk">
    <figcaption>
      <span class="no">02</span>
      <h2>暮色</h2>
      <p>最好的光</p>
    </figcaption>
  </figure>

  <figure class="card c-mist">
    <figcaption>
      <span class="no">03</span>
      <h2>晨雾</h2>
      <p>清透的蓝</p>
    </figcaption>
  </figure>

  <figure class="card c-sea">
    <figcaption>
      <span class="no">04</span>
      <h2>海风</h2>
      <p>咸味的下午</p>
    </figcaption>
  </figure>

  <figure class="card c-pine">
    <figcaption>
      <span class="no">05</span>
      <h2>松林</h2>
      <p>深深的绿</p>
    </figcaption>
  </figure>

  <figure class="card c-night">
    <figcaption>
      <span class="no">06</span>
      <h2>夜航</h2>
      <p>静静地亮着</p>
    </figcaption>
  </figure>

  <figure class="card wide c-field">
    <figcaption>
      <span class="no">07</span>
      <h2>麦田</h2>
      <p>金色到天边</p>
    </figcaption>
  </figure>
</div>
